# Album Backend 配置文件

# 服务器配置
server:
  host: "0.0.0.0"
  port: 8080
  public_base_url: "http://localhost:8080"

# 数据库配置
database:
  type: "postgres"  # sqlite, postgres
  # dsn: "data.db"  # SQLite数据库文件路径
  dsn: "host=127.0.0.1 user=album password=album@2025 dbname=album port=15432 sslmode=disable TimeZone=Asia/Shanghai"

# 存储配置
storage:
  # 主存储配置（本地存储）
  primary:
    type: "local"
    local:
      base_path: "./"
      
      # 存储池配置
      pools:
        - id: "pool-1"
          path: "./data/pool1"
          max_size: "1TB"
          priority: 1
          enabled: true
          auto_disable_threshold: 0.9
      
      # 临时文件配置
      temp:
        base_path: "./data"
        max_age: "24h"
        max_size: "10GB"
        cleanup_interval: "1h"
      
      # 处理配置
      processing:
        enable_compression: false
        compression_level: 6
        enable_encryption: false
        encryption_key_path: ""
      
      # 性能配置
      performance:
        cache_enabled: false
        cache_size: "1GB"
        cache_ttl: "24h"
        read_buffer_size: "64KB"
        write_buffer_size: "64KB"
  
  # 次存储配置（云存储备份，可选）
  secondary:
    enabled: false
    type: "openlist"  # openlist, s3, oss, cos

# 队列配置
queue:
  type: "gq"
  # TODO: 添加更多队列配置

# 认证配置
auth:
  jwt_secret: "your-secret-key-here"
  access_token_expires_in: "30m"
  refresh_token_expires_in: "720h"
  apple_app_bundle_id: "com.example.gbox.mobile"
  avatar_save_path: "./public/avatars"
  max_avatar_size: "5MB"
  url_signer_secret: "signer-secret"
  signed_url_load_ttl: "30m"

# 媒体配置
media:
  max_file_size: "100MB"
  processor:
    imagick:
      pool_size: 10
      memory_limit: "2GB"
      disk_limit: "10GB"
      raw:
        quality: 90
        format: "jpg"
        max_retries: 3
        retry_delay: "5s"
        supported_formats:
          - CR2
          - NEF
          - ARW
          - ORF
          - RW2
    ffmpeg:
      binary_path: "/usr/bin/ffmpeg"
      probe_path: "/usr/bin/ffprobe"
      max_concurrency: 4
      process_timeout: "10m"
      thumbnail_offset: 1.5
    default_image_specs:
      - name: "thumbnail"
        max_width: 400
        max_height: 400
        quality: 75
        format: "jpg"
        crop: true
      - name: "preview"
        max_width: 1280
        max_height: 0
        quality: 80
        format: "jpg"
        crop: false
      - name: "small"
        max_width: 640
        max_height: 0
        quality: 85
        format: "jpg"
        crop: false
    default_video_specs:
      - name: "preview"
        max_width: 1280
        quality: 23
        format: "mp4"
    concurrency: 4

# 日志配置
logger:
  level: "debug"   # debug, info, warn, error
  format: "console"  # json, console
  output: "stdout"  # stdout, stderr, 或文件路径

# 变更日志同步配置
changelog:
  enabled: true                    # 是否启用变更日志功能
  cleanup_interval: 24h            # 清理任务运行周期
  device_active_threshold: 4320h   # 设备活跃阈值（180天）
  default_sync_page_limit: 500     # 默认同步分页大小
  full_sync_tables:                # 全量同步表配置
    medias:
      primary_key_column: "uuid"   # 主键列名

