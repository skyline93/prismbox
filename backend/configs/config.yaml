server:
  host: 0.0.0.0
  port: 8080
  public_base_url: http://10.168.1.161:8080
  read_timeout: 1h0m0s
  write_timeout: 1h0m0s
  idle_timeout: 2m0s
database:
  type: postgres
  dsn: host=127.0.0.1 user=album password=album@2025 dbname=album port=15432 sslmode=disable TimeZone=Asia/Shanghai
storage:
  primary:
    type: local
    local:
      base_path: ./base
      pool_manager:
        delta_channel_size: 1024
        delta_batch_size: 128
        flush_interval: 2s
        cache_refresh_interval: 5m0s
        reconcile_interval: 0s
      temp:
        base_path: ./data/temp
        max_age: 24h0m0s
        max_size: 10.00GB
        cleanup_interval: 1h0m0s
      processing:
        enable_compression: false
        compression_level: 6
        enable_encryption: false
        encryption_key_path: ""
      performance:
        cache_enabled: false
        cache_size: 100.00MB
        cache_ttl: 24h0m0s
        read_buffer_size: 64.00KB
        write_buffer_size: 64.00KB
  secondary: null
auth:
  jwt_secret: change-me
  access_token_expires_in: 30m0s
  refresh_token_expires_in: 720h0m0s
  apple_app_bundle_id: ""
  avatar_save_path: ./public/avatars
  max_avatar_size: 5.00MB
  url_signer_secret: change-me-too
  signed_url_load_ttl: 30m0s
api:
  max_file_size: 10.00GB
logger:
  level: debug
  format: console
  output: stdout
  enablecaller: false
  enablestack: false
  async: false
  buffersize: 0
  fileconfig: null
changelog:
  enabled: true
  cleanup_interval: 24h0m0s
  device_active_threshold: 5m0s
  default_changelog_page_limit: 50
  full_changelog_tables: {}
queue:
  concurrency: 1
  minpollintervalms: 100
  maxpollintervalms: 5000
media:
  defaultimagespecs:
  - name: thumbnail
    max_width: 400
    max_height: 400
    quality: 75
    format: jpg
    crop: true
  - name: preview
    max_width: 1280
    max_height: 0
    quality: 80
    format: jpg
    crop: false
  - name: small
    max_width: 640
    max_height: 0
    quality: 85
    format: jpg
    crop: false
  - name: medium
    max_width: 1920
    max_height: 0
    quality: 90
    format: jpg
    crop: false
  defaultvideospecs:
  - name: preview
    max_width: 1280
    quality: 23
    format: mp4
  concurrency: 1
  imagick:
    poolsize: 1
    memorylimit: 512MB
    disklimit: 1GB
    raw:
      quality: 90
      format: jpg
      maxretries: 3
      retrydelay: 5s
      supportedformats:
      - CR2
      - NEF
      - ARW
      - ORF
      - RW2
  ffmpeg:
    binarypath: /usr/bin/ffmpeg
    probepath: /usr/bin/ffprobe
    maxconcurrency: 1
    processtimeout: 10m0s
    thumbnailoffset: 1.5
