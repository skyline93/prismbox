basePath: /api/v1
definitions:
  auth.AppleLoginInput:
    properties:
      fullName:
        properties:
          familyName:
            type: string
          givenName:
            type: string
        type: object
      identityToken:
        type: string
    required:
    - identityToken
    type: object
  auth.LoginInput:
    description: User login request body
    properties:
      email:
        description: Email
        example: john@example.com
        type: string
      password:
        description: Password
        example: password123
        type: string
    required:
    - email
    - password
    type: object
  auth.LogoutInput:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.RefreshTokenInput:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.SetPasswordInput:
    properties:
      password:
        minLength: 8
        type: string
    required:
    - password
    type: object
  auth.loginSuccessData:
    properties:
      access_token:
        description: Access token
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      refresh_token:
        description: Refresh token
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  auth.registerSuccessData:
    properties:
      user_id:
        description: User ID
        example: 1
        type: integer
      username:
        description: Username
        example: john_doe
        type: string
    type: object
  auth.uploadAvatarSuccessData:
    properties:
      avatar_url:
        type: string
    type: object
  dto.CheckHashesRequest:
    description: Check hashes request body
    properties:
      hashes:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - hashes
    type: object
  dto.CheckHashesResponse:
    description: Check hashes response
    properties:
      existing_count:
        description: Count existing
        type: integer
      existing_hashes:
        description: Hashes that already exist
        items:
          type: string
        type: array
      missing_count:
        description: Count missing
        type: integer
      missing_hashes:
        description: Hashes not yet stored
        items:
          type: string
        type: array
      total_count:
        description: Total requested
        type: integer
    type: object
  dto.CheckpointDto:
    properties:
      ack:
        description: Checkpoint ID
        type: string
      type:
        description: Sync type (e.g. "assets_v1")
        type: string
    type: object
  dto.CreateCommentInput:
    description: Create comment request body
    properties:
      content:
        type: string
      parent_comment_id:
        type: string
    required:
    - content
    type: object
  dto.CreateGroupInput:
    description: Create group request body
    properties:
      description:
        example: Family vacation 2025
        type: string
      name:
        example: Summer trip
        type: string
    required:
    - name
    type: object
  dto.CreatePostInput:
    description: Create post request body
    properties:
      caption:
        type: string
      media_uuids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - media_uuids
    type: object
  dto.CreateShareInput:
    description: Create share link request body
    properties:
      duration_minute:
        minimum: 1
        type: integer
      media_uuid:
        type: string
      target_user_id:
        type: integer
    required:
    - duration_minute
    - media_uuid
    type: object
  dto.DeleteCheckpointRequest:
    properties:
      types:
        description: Sync types to clear
        items:
          type: string
        minItems: 1
        type: array
    required:
    - types
    type: object
  dto.GetChangesResponse:
    description: Media changes response
    properties:
      changes:
        items:
          $ref: '#/definitions/dto.MediaChange'
        type: array
      since:
        type: string
    type: object
  dto.GetCheckpointResponse:
    properties:
      checkpoints:
        items:
          $ref: '#/definitions/dto.CheckpointDto'
        type: array
    type: object
  dto.GetMediasResponse:
    description: Paginated media list
    properties:
      medias:
        items:
          $ref: '#/definitions/dto.MediaResponse'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  dto.JoinGroupInput:
    description: Join group request body
    properties:
      code:
        example: A7B3D9K1
        type: string
    required:
    - code
    type: object
  dto.MediaChange:
    description: Single media change record
    properties:
      action:
        description: '"created", "updated", "deleted"'
        type: string
      hash:
        type: string
      item_type:
        type: string
      updated_at:
        type: string
      uuid:
        type: string
    type: object
  dto.MediaResponse:
    description: Media item metadata
    properties:
      backup_status:
        type: string
      created_at:
        type: string
      download_url:
        type: string
      file_size:
        type: integer
      filename:
        type: string
      hash:
        type: string
      height:
        type: integer
      item_type:
        type: string
      live_photo_video_id:
        description: 'Live Photo: linked video UUID on the image asset'
        type: string
      local_path:
        type: string
      media_taken_at:
        type: string
      mime_type:
        type: string
      original_filename:
        type: string
      preview_url:
        type: string
      processing_status:
        type: string
      thumb_hash:
        description: ThumbHash placeholder (base64)
        type: string
      thumbnail_url:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
      uuid:
        type: string
      width:
        type: integer
    type: object
  dto.SetCheckpointRequest:
    properties:
      checkpoints:
        items:
          $ref: '#/definitions/dto.CheckpointDto'
        minItems: 1
        type: array
    required:
    - checkpoints
    type: object
  dto.SyncRequestType:
    enum:
    - assets_v1
    type: string
    x-enum-varnames:
    - SyncRequestTypeAssetsV1
  dto.SyncStreamRequest:
    properties:
      reset:
        type: boolean
      types:
        items:
          $ref: '#/definitions/dto.SyncRequestType'
        minItems: 1
        type: array
      updated_after:
        description: RFC3339 timestamp
        type: string
    required:
    - types
    type: object
  dto.UpdateGroupInput:
    description: Update group request body
    properties:
      description:
        example: Best family trip of 2025
        type: string
      name:
        example: Summer trip (updated)
        type: string
    type: object
  internal_api_v1_auth.RegisterInput:
    description: User registration request body
    properties:
      email:
        description: Email
        example: john@example.com
        type: string
      password:
        description: Password (min 8 characters)
        example: password123
        minLength: 8
        type: string
      username:
        description: Username
        example: john_doe
        type: string
    required:
    - email
    - password
    - username
    type: object
  response.ApiResponse:
    properties:
      code:
        description: 0 success, non-zero failure
        type: integer
      data:
        description: Optional payload
      message:
        description: Human-readable message
        type: string
    type: object
  storage.createPoolRequest:
    properties:
      auto_disable_threshold:
        type: number
      cloud_config:
        additionalProperties: true
        type: object
      description:
        type: string
      enabled:
        type: boolean
      location:
        description: Pool location URI (required), e.g. local:///absolute/path; type
          derived from scheme
        type: string
      max_size:
        type: integer
      name:
        type: string
      priority:
        type: integer
    required:
    - location
    - max_size
    - name
    type: object
  storage.reconcileRequest:
    properties:
      dry_run:
        type: boolean
      parallel:
        type: integer
      pool_uuid:
        type: string
    type: object
  storage.updatePoolRequest:
    properties:
      auto_disable_threshold:
        type: number
      cloud_config:
        additionalProperties: true
        type: object
      description:
        type: string
      enabled:
        type: boolean
      location:
        type: string
      max_size:
        type: integer
      name:
        type: string
      priority:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: PrismBox backend HTTP API reference
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: PrismBox Backend API
  version: "1.0"
paths:
  /.well-known/prismbox:
    get:
      description: Returns API endpoint metadata for automatic client configuration
      produces:
      - application/json
      responses:
        "200":
          description: Endpoint metadata
          schema:
            additionalProperties: true
            type: object
      summary: Service discovery
      tags:
      - Discovery
  /assets/{uuid}/thumbnail:
    get:
      description: Small preview; dynamic size; Bearer auth or signed URL
      parameters:
      - description: Asset UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: 'Size: 200x200, thumbnail, preview, or single edge e.g. 200 (default
          thumbnail)'
        in: query
        name: size
        type: string
      produces:
      - image/jpeg
      responses:
        "200":
          description: Thumbnail bytes
        "400":
          description: Not found, forbidden, or not ready
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Download thumbnail
      tags:
      - Assets
  /auth/apple/login:
    post:
      consumes:
      - application/json
      description: Returns access and refresh tokens using Apple identity token
      parameters:
      - description: Apple Sign In payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.AppleLoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.loginSuccessData'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: Invalid Apple token
          schema:
            $ref: '#/definitions/response.ApiResponse'
      summary: Apple Sign In
      tags:
      - Auth
  /auth/avatar:
    post:
      consumes:
      - multipart/form-data
      description: Uploads avatar image (authentication required); jpg, jpeg, or png,
        max 5MB
      parameters:
      - description: Avatar image file
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.uploadAvatarSuccessData'
              type: object
        "400":
          description: Unsupported format or file too large
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Upload avatar
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Returns access and refresh tokens
      parameters:
      - description: Login payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.loginSuccessData'
              type: object
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: Invalid email or password
          schema:
            $ref: '#/definitions/response.ApiResponse'
      summary: Login
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the provided refresh token
      parameters:
      - description: Logout payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.LogoutInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: Invalid refresh token
          schema:
            $ref: '#/definitions/response.ApiResponse'
      summary: Logout
      tags:
      - Auth
  /auth/password/set:
    post:
      consumes:
      - application/json
      description: Sets password for the authenticated user account
      parameters:
      - description: Password payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.SetPasswordInput'
      produces:
      - application/json
      responses:
        "204":
          description: No content
        "400":
          description: Bad request or password already set
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "404":
          description: User not found
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Set password
      tags:
      - Auth
  /auth/profile:
    get:
      description: Returns profile for the current user (authentication required)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: User not found
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Get profile
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Issues a new access token using a refresh token
      parameters:
      - description: Refresh token payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshTokenInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: Invalid or revoked refresh token
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: Refresh token expired
          schema:
            $ref: '#/definitions/response.ApiResponse'
      summary: Refresh access token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new account with username, email, and password
      parameters:
      - description: Registration payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/internal_api_v1_auth.RegisterInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.registerSuccessData'
              type: object
        "400":
          description: Bad request or username/email already exists
          schema:
            $ref: '#/definitions/response.ApiResponse'
      summary: Register user
      tags:
      - Auth
  /comments/{commentId}:
    delete:
      description: Deletes a comment (authentication required; author or group admin)
      parameters:
      - description: Comment ID
        in: path
        name: commentId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: Comment not found, not a member, or forbidden
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Delete comment
      tags:
      - Comments
  /groups:
    get:
      description: Lists all groups the current user is a member of (authentication
        required)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: List my groups
      tags:
      - Groups
    post:
      consumes:
      - application/json
      description: Creates a new group (authentication required)
      parameters:
      - description: Group payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.CreateGroupInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Create group
      tags:
      - Groups
  /groups/{uuid}:
    get:
      description: Returns details for a group (authentication required; must be a
        member)
      parameters:
      - description: Group UUID
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: Group not found or forbidden
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Get group details
      tags:
      - Groups
    put:
      consumes:
      - application/json
      description: Updates name and description (authentication required; owner or
        admin)
      parameters:
      - description: Group UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: Update payload
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateGroupInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: Group not found or forbidden
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "403":
          description: Forbidden; must be owner or admin
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Update group
      tags:
      - Groups
  /groups/{uuid}/feed:
    get:
      description: Paginated post feed for a group (authentication required; must
        be a member)
      parameters:
      - description: Group UUID
        in: path
        name: uuid
        required: true
        type: string
      - default: 1
        description: Page number (default 1)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Page size (default 20)
        in: query
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: Group not found or not a member
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Get group feed
      tags:
      - Posts
  /groups/{uuid}/leave:
    post:
      description: Leaves the specified group (authentication required; owner cannot
        leave)
      parameters:
      - description: Group UUID
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: Group not found, not a member, or owner
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Leave group
      tags:
      - Groups
  /groups/{uuid}/media/{media_uuid}/preview:
    get:
      description: Preview image bytes (authentication required; must be a member)
      parameters:
      - description: Group UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: Media UUID
        in: path
        name: media_uuid
        required: true
        type: string
      produces:
      - image/jpeg
      responses:
        "200":
          description: Preview bytes
        "400":
          description: Media not found, forbidden, or not ready
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Get group media preview
      tags:
      - Groups
  /groups/{uuid}/media/{media_uuid}/thumbnail:
    get:
      description: Thumbnail bytes (authentication required; must be a member)
      parameters:
      - description: Group UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: Media UUID
        in: path
        name: media_uuid
        required: true
        type: string
      produces:
      - image/jpeg
      responses:
        "200":
          description: Thumbnail bytes
        "400":
          description: Media not found, forbidden, or not ready
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Get group media thumbnail
      tags:
      - Groups
  /groups/{uuid}/members:
    get:
      description: Lists all members (authentication required; must be a member)
      parameters:
      - description: Group UUID
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: Group not found or forbidden
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: List group members
      tags:
      - Groups
  /groups/{uuid}/members/{userId}:
    delete:
      description: Removes a member (authentication required; owner or admin; cannot
        remove owner)
      parameters:
      - description: Group UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: User ID
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: Group/user not found or cannot remove owner
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "403":
          description: Forbidden; must be owner or admin
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: Remove member
      tags:
      - Groups
  /groups/{uuid}/members/invite:
    post:
      description: Creates an invitation code (authentication required; owner or admin)
      parameters:
      - description: Group UUID
        in: path
        name: uuid
        required: true
