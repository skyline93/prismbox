  /media/upload-stream:
    head:
      description: 用于客户端验证上传端点是否可用（HEAD 请求）
      responses:
        "200":
          description: 端点可用
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 验证上传端点
      tags:
      - Media
    post:
      consumes:
      - multipart/form-data
      description: 上传图片或视频文件，支持秒传（通过 hash 检查）。如果文件已存在，直接返回已存在的媒体信息
      parameters:
      - description: 媒体文件
        in: formData
        name: file
        required: true
        type: file
      - description: 文件 MD5 哈希值（32位十六进制字符串）
        in: formData
        name: hash
        required: true
        type: string
      - description: 媒体类型
        enum:
        - image
        - video
        in: formData
        name: item_type
        required: true
        type: string
      - description: 客户端生成的 UUID
        in: formData
        name: cloud_uuid
        required: true
        type: string
      - description: 原始文件名
        in: formData
        name: original_filename
        type: string
      - description: 媒体拍摄时间（RFC3339 格式）
        in: formData
        name: media_taken_at
        type: string
      - description: 关联的 Live Photo 视频媒体 UUID（仅当当前上传的是图片主资产时使用）
        in: formData
        name: live_photo_video_id
        type: string
      - description: 是否为 Live Photo 附属视频（仅当 item_type=video 时使用；传 "1" 或 "true" 表示该视频为 Live Photo 附属，同步时将排除该条记录）
        in: formData
        name: is_live_photo_video
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 文件已存在（秒传）
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.MediaResponse'
              type: object
        "201":
          description: 上传成功
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.MediaResponse'
              type: object
        "400":
          description: 请求参数错误或文件格式不支持
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 上传媒体文件
      tags:
      - Media
