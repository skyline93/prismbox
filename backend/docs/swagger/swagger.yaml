basePath: /api/v1
definitions:
  auth.AppleLoginInput:
    properties:
      fullName:
        properties:
          familyName:
            type: string
          givenName:
            type: string
        type: object
      identityToken:
        type: string
    required:
    - identityToken
    type: object
  auth.LoginInput:
    description: 用户登录请求体
    properties:
      email:
        description: 邮箱地址
        example: john@example.com
        type: string
      password:
        description: 密码
        example: password123
        type: string
    required:
    - email
    - password
    type: object
  auth.LogoutInput:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.RefreshTokenInput:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.SetPasswordInput:
    properties:
      password:
        minLength: 8
        type: string
    required:
    - password
    type: object
  auth.loginSuccessData:
    properties:
      access_token:
        description: 访问令牌
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      refresh_token:
        description: 刷新令牌
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  auth.registerSuccessData:
    properties:
      user_id:
        description: 用户ID
        example: 1
        type: integer
      username:
        description: 用户名
        example: john_doe
        type: string
    type: object
  auth.uploadAvatarSuccessData:
    properties:
      avatar_url:
        type: string
    type: object
  dto.CheckHashesRequest:
    description: 检查文件哈希的请求体
    properties:
      hashes:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - hashes
    type: object
  dto.CheckHashesResponse:
    description: 检查哈希的响应数据
    properties:
      existing_count:
        description: 已存在数量
        type: integer
      existing_hashes:
        description: 已存在的哈希列表
        items:
          type: string
        type: array
      missing_count:
        description: 缺失数量
        type: integer
      missing_hashes:
        description: 缺失的哈希列表
        items:
          type: string
        type: array
      total_count:
        description: 总数量
        type: integer
    type: object
  dto.CheckpointDto:
    properties:
      ack:
        description: Checkpoint ID
        type: string
      type:
        description: 同步类型（如 "assets_v1"）
        type: string
    type: object
  dto.CreateCommentInput:
    description: 创建评论的请求体
    properties:
      content:
        type: string
      parent_comment_id:
        type: string
    required:
    - content
    type: object
  dto.CreateGroupInput:
    description: 创建圈子的请求体
    properties:
      description:
        example: 2025年的家庭旅行
        type: string
      name:
        example: 巴厘岛假日
        type: string
    required:
    - name
    type: object
  dto.CreatePostInput:
    description: 创建帖子的请求体
    properties:
      caption:
        type: string
      media_uuids:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - media_uuids
    type: object
  dto.CreateShareInput:
    description: 创建分享链接的请求体
    properties:
      duration_minute:
        minimum: 1
        type: integer
      media_uuid:
        type: string
      target_user_id:
        type: integer
    required:
    - duration_minute
    - media_uuid
    type: object
  dto.DeleteCheckpointRequest:
    properties:
      types:
        description: 要删除的同步类型列表
        items:
          type: string
        minItems: 1
        type: array
    required:
    - types
    type: object
  dto.GetChangesResponse:
    description: 媒体变更列表响应数据
    properties:
      changes:
        items:
          $ref: '#/definitions/dto.MediaChange'
        type: array
      since:
        type: string
    type: object
  dto.GetCheckpointResponse:
    properties:
      checkpoints:
        items:
          $ref: '#/definitions/dto.CheckpointDto'
        type: array
    type: object
  dto.GetMediasResponse:
    description: 媒体列表响应数据
    properties:
      medias:
        items:
          $ref: '#/definitions/dto.MediaResponse'
        type: array
      page:
        type: integer
      page_size:
        type: integer
      total:
        type: integer
    type: object
  dto.JoinGroupInput:
    description: 加入圈子的请求体
    properties:
      code:
        example: A7B3D9K1
        type: string
    required:
    - code
    type: object
  dto.MediaChange:
    description: 媒体变更记录
    properties:
      action:
        description: '"created", "updated", "deleted"'
        type: string
      hash:
        type: string
      item_type:
        type: string
      updated_at:
        type: string
      uuid:
        type: string
    type: object
  dto.MediaResponse:
    description: 媒体信息响应
    properties:
      backup_status:
        type: string
      created_at:
        type: string
      download_url:
        type: string
      file_size:
        type: integer
      filename:
        type: string
      hash:
        type: string
      height:
        type: integer
      item_type:
        type: string
      local_path:
        type: string
      media_taken_at:
        type: string
      mime_type:
        type: string
      original_filename:
        type: string
      preview_url:
        type: string
      processing_status:
        type: string
      thumb_hash:
        description: ThumbHash 占位符（base64 编码）
        type: string
      thumbnail_url:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
      uuid:
        type: string
      width:
        type: integer
      live_photo_video_id:
        description: 关联的 Live Photo 视频媒体 UUID（仅对图片资产有效）
        type: string
    type: object
  dto.SetCheckpointRequest:
    properties:
      checkpoints:
        items:
          $ref: '#/definitions/dto.CheckpointDto'
        minItems: 1
        type: array
    required:
    - checkpoints
    type: object
  dto.SyncRequestType:
    enum:
    - assets_v1
    type: string
    x-enum-varnames:
    - SyncRequestTypeAssetsV1
  dto.SyncStreamRequest:
    properties:
      reset:
        type: boolean
      types:
        items:
          $ref: '#/definitions/dto.SyncRequestType'
        minItems: 1
        type: array
      updated_after:
        description: RFC3339 格式的时间戳
        type: string
    required:
    - types
    type: object
  dto.UpdateGroupInput:
    description: 更新圈子的请求体
    properties:
      description:
        example: 2025年最棒的家庭旅行
        type: string
      name:
        example: 巴厘岛假日 updated
        type: string
    type: object
  internal_api_v1_auth.RegisterInput:
    description: 用户注册请求体
    properties:
      email:
        description: 邮箱地址
        example: john@example.com
        type: string
      password:
        description: 密码（至少8位）
        example: password123
        minLength: 8
        type: string
      username:
        description: 用户名
        example: john_doe
        type: string
    required:
    - email
    - password
    - username
    type: object
  response.ApiResponse:
    properties:
      code:
        description: 0=成功, 1=失败
        type: integer
      data:
        description: 响应数据
      message:
        description: 响应消息
        type: string
    type: object
  storage.createPoolRequest:
    properties:
      auto_disable_threshold:
        type: number
      cloud_config:
        additionalProperties: true
        type: object
      description:
        type: string
      enabled:
        type: boolean
      local_path:
        type: string
      max_size:
        type: integer
      name:
        type: string
      priority:
        type: integer
      storage_type:
        type: string
    required:
    - max_size
    - name
    - storage_type
    type: object
  storage.reconcileRequest:
    properties:
      dry_run:
        type: boolean
      parallel:
        type: integer
      pool_uuid:
        type: string
    type: object
  storage.updatePoolRequest:
    properties:
      auto_disable_threshold:
        type: number
      cloud_config:
        additionalProperties: true
        type: object
      description:
        type: string
      enabled:
        type: boolean
      local_path:
        type: string
      max_size:
        type: integer
      name:
        type: string
      priority:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: support@prismbox.example.com
    name: API Support
    url: https://prismbox.example.com/support
  description: PrismBox 后端服务 API 文档
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://prismbox.example.com/terms
  title: PrismBox Backend API
  version: "1.0"
paths:
  /.well-known/prismbox:
    get:
      description: 返回 API 端点信息，用于客户端自动发现
      produces:
      - application/json
      responses:
        "200":
          description: 端点信息
          schema:
            additionalProperties: true
            type: object
      summary: 端点发现
      tags:
      - Discovery
  /assets/{uuid}/thumbnail:
    get:
      description: 下载资产的缩略图（小尺寸预览），支持动态尺寸和认证或签名 URL 访问
      parameters:
      - description: 资产 UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: 尺寸参数：200x200, thumbnail, preview, 或单边限制如 200（默认：thumbnail）
        in: query
        name: size
        type: string
      produces:
      - image/jpeg
      responses:
        "200":
          description: 缩略图内容
        "400":
          description: 资产不存在、权限不足或文件未处理完成
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 下载资产缩略图
      tags:
      - Assets
  /auth/apple/login:
    post:
      consumes:
      - application/json
      description: 使用 Apple ID 登录，返回访问令牌和刷新令牌
      parameters:
      - description: Apple 登录信息
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.AppleLoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.loginSuccessData'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: Apple token 无效
          schema:
            $ref: '#/definitions/response.ApiResponse'
      summary: Apple 登录
      tags:
      - Auth
  /auth/avatar:
    post:
      consumes:
      - multipart/form-data
      description: 上传用户头像图片（需要认证），支持 jpg、jpeg、png 格式，最大 5MB
      parameters:
      - description: 头像图片文件
        in: formData
        name: avatar
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: 上传成功
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.uploadAvatarSuccessData'
              type: object
        "400":
          description: 文件格式不支持或文件过大
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 上传头像
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: 使用邮箱和密码登录，返回访问令牌和刷新令牌
      parameters:
      - description: 登录信息
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.LoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.loginSuccessData'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: 认证失败，邮箱或密码错误
          schema:
            $ref: '#/definitions/response.ApiResponse'
      summary: 用户登录
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: 撤销刷新令牌，登出用户
      parameters:
      - description: 登出信息
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.LogoutInput'
      produces:
      - application/json
      responses:
        "200":
          description: 登出成功
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: 刷新令牌无效
          schema:
            $ref: '#/definitions/response.ApiResponse'
      summary: 用户登出
      tags:
      - Auth
  /auth/password/set:
    post:
      consumes:
      - application/json
      description: 为用户账号设置密码（需要认证）
      parameters:
      - description: 密码信息
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.SetPasswordInput'
      produces:
      - application/json
      responses:
        "204":
          description: 密码设置成功
        "400":
          description: 请求参数错误或密码已设置
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "404":
          description: 用户不存在
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 设置密码
      tags:
      - Auth
  /auth/profile:
    get:
      description: 获取当前登录用户的资料信息（需要认证）
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: 用户不存在
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 获取用户资料
      tags:
      - Auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用刷新令牌获取新的访问令牌
      parameters:
      - description: 刷新令牌信息
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshTokenInput'
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  additionalProperties:
                    type: string
                  type: object
              type: object
        "400":
          description: 刷新令牌无效或已撤销
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: 刷新令牌已过期
          schema:
            $ref: '#/definitions/response.ApiResponse'
      summary: 刷新访问令牌
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: 创建新用户账号，需要提供用户名、邮箱和密码
      parameters:
      - description: 注册信息
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/internal_api_v1_auth.RegisterInput'
      produces:
      - application/json
      responses:
        "200":
          description: 注册成功
          schema:
            allOf:
            - $ref: '#/definitions/response.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.registerSuccessData'
              type: object
        "400":
          description: 请求参数错误或用户名/邮箱已存在
          schema:
            $ref: '#/definitions/response.ApiResponse'
      summary: 用户注册
      tags:
      - Auth
  /comments/{commentId}:
    delete:
      description: 删除指定的评论（需要认证，必须是评论作者或圈子管理员）
      parameters:
      - description: 评论 ID
        in: path
        name: commentId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: 评论不存在、不是成员或权限不足
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 删除评论
      tags:
      - Comments
  /groups:
    get:
      description: 获取当前用户加入的所有圈子列表（需要认证）
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 获取我的圈子列表
      tags:
      - Groups
    post:
      consumes:
      - application/json
      description: 创建一个新的圈子（需要认证）
      parameters:
      - description: 圈子信息
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.CreateGroupInput'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 创建圈子
      tags:
      - Groups
  /groups/{uuid}:
    get:
      description: 获取指定圈子的详细信息（需要认证，必须是圈子成员）
      parameters:
      - description: 圈子 UUID
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: 圈子不存在或权限不足
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 获取圈子详情
      tags:
      - Groups
    put:
      consumes:
      - application/json
      description: 更新圈子的名称和描述（需要认证，必须是圈子管理员或所有者）
      parameters:
      - description: 圈子 UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: 更新信息
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/dto.UpdateGroupInput'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: 圈子不存在或权限不足
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "403":
          description: 权限不足，必须是管理员或所有者
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 更新圈子信息
      tags:
      - Groups
  /groups/{uuid}/feed:
    get:
      description: 获取圈子的帖子Feed流，支持分页（需要认证，必须是圈子成员）
      parameters:
      - description: 圈子 UUID
        in: path
        name: uuid
        required: true
        type: string
      - default: 1
        description: 页码（默认1）
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: 每页数量（默认20）
        in: query
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: 圈子不存在或不是成员
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 获取圈子Feed流
      tags:
      - Posts
  /groups/{uuid}/leave:
    post:
      description: 退出指定的圈子（需要认证，所有者不能退出）
      parameters:
      - description: 圈子 UUID
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 退出成功
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "400":
          description: 圈子不存在、不是成员或是所有者
          schema:
            $ref: '#/definitions/response.ApiResponse'
        "401":
          description: 未认证
          schema:
            $ref: '#/definitions/response.ApiResponse'
      security:
      - BearerAuth: []
      summary: 退出圈子
      tags:
      - Groups
  /groups/{uuid}/media/{media_uuid}/preview:
    get:
