basePath: /api/v1
definitions:
  auth.LogoutInput:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    required:
    - refresh_token
    type: object
  auth.RefreshTokenInput:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    required:
    - refresh_token
    type: object
  auth.RefreshTokenSuccessData:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  auth.UserLoginInput:
    properties:
      password:
        example: aVeryStrongPassword123
        type: string
      username:
        example: newuser
        type: string
    required:
    - password
    - username
    type: object
  auth.UserLoginSuccessData:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    type: object
  auth.UserProfileResponse:
    properties:
      created_at:
        example: "2023-10-27T10:00:00Z"
        type: string
      email:
        example: testuser@example.com
        type: string
      id:
        example: 1
        type: integer
      username:
        example: testuser
        type: string
    type: object
  auth.UserRegisterInput:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: aVeryStrongPassword123
        minLength: 8
        type: string
      username:
        example: newuser
        type: string
    required:
    - email
    - password
    - username
    type: object
  auth.UserRegisterSuccessData:
    properties:
      user_id:
        example: 1
        type: integer
      username:
        example: newuser
        type: string
    type: object
  constant.MediaType:
    enum:
    - IMAGE
    - VIDEO
    type: string
    x-enum-varnames:
    - TypeImage
    - TypeVideo
  constant.ProcessingStatus:
    enum:
    - PENDING
    - COMPLETED
    - FAILED
    type: string
    x-enum-varnames:
    - StatusPending
    - StatusCompleted
    - StatusFailed
  core.ApiResponse:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
  group.CommentResponse:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: integer
      user:
        $ref: '#/definitions/group.UserInfo'
    type: object
  group.CreateCommentInput:
    properties:
      content:
        type: string
    required:
    - content
    type: object
  group.CreateGroupInput:
    properties:
      description:
        example: 2025年的家庭旅行
        type: string
      name:
        example: 巴厘岛假日
        type: string
    required:
    - name
    type: object
  group.GroupFeedItemResponse:
    properties:
      caption:
        type: string
      group_media_id:
        type: integer
      media_details:
        $ref: '#/definitions/models.Media'
      shared_at:
        type: string
      uploader:
        $ref: '#/definitions/group.UploaderInfo'
    type: object
  group.GroupMemberResponse:
    properties:
      joined_at:
        type: string
      role:
        $ref: '#/definitions/models.GroupRole'
      user_id:
        type: integer
      username:
        type: string
    type: object
  group.JoinGroupInput:
    properties:
      code:
        example: A7B3D9K1
        type: string
    required:
    - code
    type: object
  group.ShareMediaInput:
    properties:
      caption:
        type: string
      media_uuids:
        items:
          type: string
        type: array
    required:
    - media_uuids
    type: object
  group.UpdateGroupInput:
    properties:
      description:
        example: 2025年最棒的家庭旅行
        type: string
      name:
        example: 巴厘岛假日 updated
        type: string
    type: object
  group.UploaderInfo:
    properties:
      user_id:
        type: integer
      username:
        type: string
    type: object
  group.UserInfo:
    properties:
      user_id:
        type: integer
      username:
        type: string
    type: object
  handlers.AddItemsToAlbumInput:
    properties:
      media_uuids:
        items:
          type: string
        type: array
    required:
    - media_uuids
    type: object
  handlers.CheckHashesRequest:
    properties:
      hashes:
        items:
          type: string
        type: array
    required:
    - hashes
    type: object
  handlers.CheckHashesResponse:
    properties:
      existing_hashes:
        items:
          type: string
        type: array
    type: object
  handlers.CreateAlbumInput:
    properties:
      description:
        example: 2025年春节的欢乐时光
        type: string
      name:
        example: 我的家庭聚会
        type: string
    required:
    - name
    type: object
  handlers.CreateShareInput:
    properties:
      duration_minute:
        minimum: 1
        type: integer
      media_uuid:
        type: string
      target_user_id:
        type: integer
    required:
    - duration_minute
    - media_uuid
    type: object
  handlers.MediaChangesResponse:
    properties:
      created:
        items:
          $ref: '#/definitions/handlers.MediaResponse'
        type: array
      deleted:
        description: 删除的媒体只返回 UUID
        items:
          type: string
        type: array
      updated:
        items:
          $ref: '#/definitions/handlers.MediaResponse'
        type: array
    type: object
  handlers.MediaResponse:
    properties:
      created_at:
        type: string
      download_url:
        type: string
      filename:
        type: string
      hash:
        type: string
      item_type:
        $ref: '#/definitions/constant.MediaType'
      media_taken_at:
        type: string
      original_filename:
        type: string
      preview_url:
        type: string
      thumbnail_url:
        type: string
      updated_at:
        type: string
      uuid:
        type: string
    type: object
  handlers.ShareMetaResponse:
    properties:
      height:
        type: integer
      item_type:
        $ref: '#/definitions/constant.MediaType'
      media_taken_at:
        type: string
      original_filename:
        type: string
      signed_url:
        type: string
      uuid:
        type: string
      width:
        type: integer
    type: object
  models.Album:
    properties:
      cover_media_uuid:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      item_count:
        type: integer
      items:
        items:
          $ref: '#/definitions/models.Media'
        type: array
      name:
        type: string
      updated_at:
        type: string
      user_id:
        description: '❗ 核心改动: 关联用户'
        type: integer
      uuid:
        type: string
    type: object
  models.Comment:
    properties:
      content:
        type: string
      created_at:
        type: string
      group_media_id:
        type: integer
      id:
        type: integer
      updated_at:
        type: string
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: 预加载评论者信息
      user_id:
        type: integer
    type: object
  models.Group:
    properties:
      cover_media_uuid:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      owner_id:
        type: integer
      updated_at:
        type: string
      uuid:
        type: string
    type: object
  models.GroupInvite:
    properties:
      code:
        type: string
      created_at:
        type: string
      created_by_id:
        type: integer
      expires_at:
        type: string
      group_id:
        type: integer
      id:
        type: integer
      usage_limit:
        description: 0 表示无限制
        type: integer
    type: object
  models.GroupRole:
    enum:
    - owner
    - admin
    - member
    type: string
    x-enum-varnames:
    - RoleOwner
    - RoleAdmin
    - RoleMember
  models.Media:
    properties:
      aperture:
        type: string
      camera_make:
        type: string
      camera_model:
        type: string
      created_at:
        type: string
      duration:
        type: number
      file_size:
        type: integer
      filename:
        type: string
      hash:
        type: string
      height:
        type: integer
      id:
        type: integer
      iso:
        type: integer
      item_type:
        $ref: '#/definitions/constant.MediaType'
      latitude:
        type: number
      longitude:
        type: number
      media_taken_at:
        type: string
      mime_type:
        type: string
      original_filename:
        type: string
      processing_status:
        $ref: '#/definitions/constant.ProcessingStatus'
      shutter_speed:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
      uuid:
        type: string
      width:
        type: integer
    type: object
  models.Share:
    properties:
      createdAt:
        type: string
      expiresAt:
        description: 分享的过期时间
        type: string
      id:
        type: integer
      isRevoked:
        description: 是否已被创建者手动撤销
        type: boolean
      media:
        $ref: '#/definitions/models.Media'
      mediaID:
        description: 分享的是哪个照片
        type: integer
      owner:
        $ref: '#/definitions/models.User'
      ownerID:
        description: 分享的创建者
        type: integer
      shareToken:
        description: 用于公开分享链接的唯一令牌
        type: string
      targetUser:
        $ref: '#/definitions/models.User'
      targetUserID:
        description: 分享给谁 (如果为NULL，则为游客分享)
        type: integer
      updatedAt:
        type: string
    type: object
  models.User:
    properties:
      email:
        type: string
      id:
        type: integer
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    一个用于上传、管理和浏览照片与视频的后端服务 API。
    该 API 支持用户认证、多媒体处理、相册管理，并提供标准化的响应格式。
  title: Album API
  version: "1.0"
paths:
  /albums:
    get:
      description: 获取当前用户的所有相册列表。为提高性能，此接口不包含媒体内容，只包含数量统计。
      produces:
      - application/json
      responses:
        "200":
          description: 成功获取相册列表
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Album'
                  type: array
              type: object
        "400":
          description: 数据库错误
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 获取相册列表
      tags:
      - Albums
    post:
      consumes:
      - application/json
      description: 为当前登录的用户创建一个新的相册
      parameters:
      - description: 相册信息
        in: body
        name: album
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateAlbumInput'
      produces:
      - application/json
      responses:
        "201":
          description: 相册创建成功
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Album'
              type: object
        "400":
          description: 请求参数错误或服务器内部错误
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 创建新相册
      tags:
      - Albums
  /albums/{uuid}:
    delete:
      description: 删除相册（软删除）。注意：这只删除相册和关联记录，不删除原始的照片文件。
      parameters:
      - description: 相册的UUID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 相册删除成功
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "400":
          description: 错误信息可能为 'Album not found' 或 'Failed to delete'
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 删除相册
      tags:
      - Albums
    get:
      description: 获取单个相册及其包含的所有媒体项（分页）
      parameters:
      - description: 相册的UUID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 100
        description: 每页数量
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功获取相册详情
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Album'
              type: object
        "400":
          description: 错误信息可能为 'Album not found or permission denied'
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 获取单个相册详情
      tags:
      - Albums
  /albums/{uuid}/items:
    post:
      consumes:
      - application/json
      description: 向指定相册添加一个或多个媒体项
      parameters:
      - description: 相册的UUID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      - description: 要添加的媒体UUID列表
        in: body
        name: media_uuids
        required: true
        schema:
          $ref: '#/definitions/handlers.AddItemsToAlbumInput'
      produces:
      - application/json
      responses:
        "200":
          description: 媒体项添加成功
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "400":
          description: 请求参数错误、相册或照片未找到、无权限等
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 向相册添加媒体
      tags:
      - Albums
  /auth/login:
    post:
      consumes:
      - application/json
      description: 使用用户名和密码进行登录，成功后返回访问令牌和刷新令牌
      parameters:
      - description: 用户登录凭证
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/auth.UserLoginInput'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.UserLoginSuccessData'
              type: object
        "400":
          description: 请求参数错误、用户名或密码无效或服务器内部错误
          schema:
            $ref: '#/definitions/core.ApiResponse'
      summary: 用户登录
      tags:
      - Authentication
  /auth/logout:
    post:
      consumes:
      - application/json
      description: 通过撤销指定的刷新令牌来实现服务端登出
      parameters:
      - description: 刷新令牌
        in: body
        name: token
        required: true
        schema:
          $ref: '#/definitions/auth.LogoutInput'
      produces:
      - application/json
      responses:
        "200":
          description: 成功登出
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "400":
          description: 请求参数错误或令牌无效
          schema:
            $ref: '#/definitions/core.ApiResponse'
      summary: 用户登出
      tags:
      - Authentication
  /auth/profile:
    get:
      description: 获取当前已认证用户的个人资料（不含敏感信息）
      produces:
      - application/json
      responses:
        "200":
          description: 成功获取用户资料
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.UserProfileResponse'
              type: object
        "401":
          description: 未授权或Token无效
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "404":
          description: 用户不存在（Token有效但用户已被删除）
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 获取当前用户信息
      tags:
      - Authentication
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用一个有效的、未过期的刷新令牌来获取一个新的访问令牌
      parameters:
      - description: 刷新令牌
        in: body
        name: token
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshTokenInput'
      produces:
      - application/json
      responses:
        "200":
          description: 成功刷新令牌
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.RefreshTokenSuccessData'
              type: object
        "400":
          description: 请求参数错误或刷新令牌无效、已过期或已被撤销
          schema:
            $ref: '#/definitions/core.ApiResponse'
      summary: 刷新访问令牌
      tags:
      - Authentication
  /auth/register:
    post:
      consumes:
      - application/json
      description: 根据用户名、邮箱和密码创建一个新的用户账户
      parameters:
      - description: 用户注册信息
        in: body
        name: credentials
        required: true
        schema:
          $ref: '#/definitions/auth.UserRegisterInput'
      produces:
      - application/json
      responses:
        "200":
          description: 用户注册成功
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/auth.UserRegisterSuccessData'
              type: object
        "400":
          description: 请求参数错误、用户已存在或服务器内部错误
          schema:
            $ref: '#/definitions/core.ApiResponse'
      summary: 注册新用户
      tags:
      - Authentication
  /comments/{commentId}:
    delete:
      description: 删除一条评论，仅限评论发布者或圈主/管理员操作
      parameters:
      - description: 评论的ID
        in: path
        name: commentId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 评论删除成功
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "403":
          description: 无权限操作
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 删除评论
      tags:
      - Groups
  /group-media/{groupMediaId}:
    delete:
      description: 从圈子中移除一张照片，仅限照片上传者或圈主/管理员操作
      parameters:
      - description: 圈子媒体的ID (group_media_id)
        in: path
        name: groupMediaId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 照片移除成功
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "403":
          description: 无权限操作
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 从圈子移除照片
      tags:
      - Groups
  /group-media/{groupMediaId}/comments:
    get:
      description: 获取圈子中某个媒体的所有评论
      parameters:
      - description: 圈子媒体的ID (group_media_id)
        in: path
        name: groupMediaId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取评论列表成功
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/group.CommentResponse'
                  type: array
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "403":
          description: 无权限操作（非圈子成员）
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 获取评论列表
      tags:
      - Groups
    post:
      consumes:
      - application/json
      description: 为圈子中的某个媒体添加一条评论
      parameters:
      - description: 圈子媒体的ID (group_media_id)
        in: path
        name: groupMediaId
        required: true
        type: integer
      - description: 评论内容
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/group.CreateCommentInput'
      produces:
      - application/json
      responses:
        "200":
          description: 评论成功
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Comment'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "403":
          description: 无权限操作（非圈子成员）
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 添加评论
      tags:
      - Groups
  /groups:
    get:
      description: 获取当前用户加入的所有圈子列表
      produces:
      - application/json
      responses:
        "200":
          description: 成功获取圈子列表
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Group'
                  type: array
              type: object
        "400":
          description: 数据库错误
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 获取我加入的圈子列表
      tags:
      - Groups
    post:
      consumes:
      - application/json
      description: 为当前登录的用户创建一个新的圈子，创建者自动成为“所有者”
      parameters:
      - description: 圈子信息
        in: body
        name: group
        required: true
        schema:
          $ref: '#/definitions/group.CreateGroupInput'
      produces:
      - application/json
      responses:
        "200":
          description: 圈子创建成功
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Group'
              type: object
        "400":
          description: 请求参数错误或服务器内部错误
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 创建新圈子
      tags:
      - Groups
  /groups/{uuid}:
    get:
      description: 获取单个圈子的详细信息，前提是当前用户是该圈子成员
      parameters:
      - description: 圈子的UUID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功获取圈子详情
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Group'
              type: object
        "400":
          description: 圈子未找到或无权限
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 获取圈子详情
      tags:
      - Groups
    put:
      consumes:
      - application/json
      description: 更新圈子名称或描述，仅限圈主或管理员操作
      parameters:
      - description: 圈子的UUID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      - description: 要更新的圈子信息
        in: body
        name: group
        required: true
        schema:
          $ref: '#/definitions/group.UpdateGroupInput'
      produces:
      - application/json
      responses:
        "200":
          description: 圈子信息更新成功
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Group'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "403":
          description: 无权限操作
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 更新圈子信息
      tags:
      - Groups
  /groups/{uuid}/leave:
    post:
      description: 当前用户主动退出一个圈子，圈主无法退出
      parameters:
      - description: 圈子的UUID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功退出圈子
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "400":
          description: 圈主无法退出
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 退出圈子
      tags:
      - Groups
  /groups/{uuid}/media:
    get:
      description: 分页获取圈子中的媒体分享，按分享时间倒序排列
      parameters:
      - description: 圈子的UUID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 50
        description: 每页数量
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功获取Feed流
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/group.GroupFeedItemResponse'
                  type: array
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "403":
          description: 无权限操作（非圈子成员）
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 获取圈子 Feed 流
      tags:
      - Groups
    post:
      consumes:
      - application/json
      description: 将当前用户拥有的一个或多个媒体分享到指定的圈子
      parameters:
      - description: 圈子的UUID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      - description: 要分享的媒体UUID列表和可选的说明
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/group.ShareMediaInput'
      produces:
      - application/json
      responses:
        "200":
          description: 媒体分享成功
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "400":
          description: 请求参数错误、照片未找到等
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "403":
          description: 无权限操作（非圈子成员）
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 分享媒体到圈子
      tags:
      - Groups
  /groups/{uuid}/members:
    get:
      description: 获取指定圈子的所有成员及其角色
      parameters:
      - description: 圈子的UUID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功获取成员列表
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/group.GroupMemberResponse'
                  type: array
              type: object
        "400":
          description: 圈子未找到或无权限
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 获取圈子成员列表
      tags:
      - Groups
  /groups/{uuid}/members/{userId}:
    delete:
      description: 从圈子中移除一个成员，仅限圈主或管理员操作
      parameters:
      - description: 圈子的UUID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      - description: 要移除的用户ID
        in: path
        name: userId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成员移除成功
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "403":
          description: 无权限操作
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 移除成员
      tags:
      - Groups
  /groups/{uuid}/members/invite:
    post:
      description: 为指定的圈子创建一个有时效性的邀请码，仅限圈主或管理员操作。
      parameters:
      - description: 圈子的UUID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 邀请码创建成功
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.GroupInvite'
              type: object
        "400":
          description: 圈子未找到
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "403":
          description: 无权限操作
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 创建邀请码
      tags:
      - Groups
  /groups/join:
    post:
      consumes:
      - application/json
      description: 使用一个有效的邀请码加入对应的圈子
      parameters:
      - description: 邀请码
        in: body
        name: input
        required: true
        schema:
          $ref: '#/definitions/group.JoinGroupInput'
      produces:
      - application/json
      responses:
        "200":
          description: 成功加入圈子
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/models.Group'
              type: object
        "400":
          description: 邀请码无效、已过期或用户已是成员
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 使用邀请码加入圈子
      tags:
      - Groups
  /media:
    get:
      description: 获取当前用户的所有媒体列表（分页）
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 100
        description: 每页数量
        in: query
        name: limit
        type: integer
      - description: 只返回在此时间戳 (ISO 8601) 之后更新的记录
        in: query
        name: updated_since
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功获取媒体列表
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/handlers.MediaResponse'
                  type: array
              type: object
        "400":
          description: 数据库错误
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 获取媒体列表
      tags:
      - Media
  /media/{uuid}:
    delete:
      description: 将指定的媒体文件移入回收站（软删除）
      parameters:
      - description: 媒体文件的UUID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功删除
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "400":
          description: 错误信息可能为 'Media not found or permission denied' 或 'Database
            error'
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 删除指定的媒体文件
      tags:
      - Media
    get:
      description: 获取指定UUID的媒体详情。可以通过用户认证或有效的分享链接访问。
      parameters:
      - description: 媒体文件的UUID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功获取媒体详情
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.MediaResponse'
              type: object
        "400":
          description: 错误信息可能为 'Media not found or permission denied' 或 'Database
            error'
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 获取媒体详情
      tags:
      - Media
  /media/{uuid}/download/original:
    get:
      description: 下载指定UUID的原始媒体文件。可以通过用户认证或有效的分享链接访问。
      parameters:
      - description: 媒体文件的UUID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: 原始文件数据
          schema:
            type: file
        "403":
          description: 权限不足或分享链接无效/过期
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "404":
          description: 照片未找到
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "500":
          description: 文件未就绪或服务器内部错误
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      - SignedURL: []
      summary: 下载原始文件
      tags:
      - Media
  /media/{uuid}/download/preview:
    get:
      description: 获取指定UUID的预览文件。可以通过用户认证或有效的分享链接访问。
      parameters:
      - description: 媒体文件的UUID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - image/jpeg
      - video/mp4
      responses:
        "200":
          description: 预览文件数据
          schema:
            type: file
        "403":
          description: 权限不足或分享链接无效/过期
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "404":
          description: 照片未找到
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "500":
          description: 文件未就绪或服务器内部错误
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      - SignedURL: []
      summary: 获取预览图或预览视频
      tags:
      - Media
  /media/{uuid}/download/thumbnail:
    get:
      description: 获取指定UUID的缩略图。可以通过用户认证或有效的分享链接访问。
      parameters:
      - description: 媒体文件的UUID
        format: uuid
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - image/jpeg
      responses:
        "200":
          description: 缩略图文件数据
          schema:
            type: file
        "403":
          description: 权限不足或分享链接无效/过期
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "404":
          description: 照片未找到
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "500":
          description: 文件未就绪或服务器内部错误
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      - SignedURL: []
      summary: 获取缩略图
      tags:
      - Media
  /media/changes:
    get:
      description: 根据客户端提供的 `since` 时间戳，返回此时间之后所有创建、更新和删除的媒体信息。如果 `since` 未提供，则返回所有媒体的全量数据。
      parameters:
      - description: 【可选】客户端本地记录的最新更新时间戳 (ISO 8601 格式)。如果为空，则执行全量同步。
        in: query
        name: since
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功获取变更
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.MediaChangesResponse'
              type: object
        "400":
          description: 时间戳格式错误
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 获取媒体变更（增量或全量）
      tags:
      - Media
  /media/check_hashes:
    post:
      consumes:
      - application/json
      description: 客户端上传文件前，先通过此接口检查哪些文件（通过哈希）已经存在于云端，避免重复上传。
      parameters:
      - description: 包含文件哈希值数组的JSON对象
        in: body
        name: hashes
        required: true
        schema:
          $ref: '#/definitions/handlers.CheckHashesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 查询成功
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.CheckHashesResponse'
              type: object
        "400":
          description: 请求体解析错误
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 批量预检哈希
      tags:
      - Media
  /media/upload:
    post:
      consumes:
      - multipart/form-data
      description: 通过 multipart/form-data 上传照片或视频。服务器会先进行秒传检查。
      parameters:
      - description: 媒体文件本身
        in: formData
        name: file
        required: true
        type: file
      - description: 文件的SHA256哈希值
        in: formData
        name: hash
        required: true
        type: string
      - description: 媒体类型 (IMAGE 或 VIDEO)
        enum:
        - IMAGE
        - VIDEO
        in: formData
        name: item_type
        required: true
        type: string
      - description: 文件的原始名称
        in: formData
        name: original_filename
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 文件已存在（秒传成功）
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.MediaResponse'
              type: object
        "201":
          description: 上传成功，后台处理开始
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.MediaResponse'
              type: object
        "400":
          description: 请求参数错误、文件上传失败或服务器内部错误
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 上传单个媒体文件
      tags:
      - Media
  /s/{share_token}:
    get:
      description: 通过一个公开的分享令牌访问媒体资源。服务器会返回一个包含临时签名URL的HTML页面。
      parameters:
      - description: 分享令牌
        in: path
        name: share_token
        required: true
        type: string
      produces:
      - text/html
      responses:
        "200":
          description: 包含媒体资源的HTML页面
          schema:
            type: string
        "404":
          description: 分享链接不存在
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "410":
          description: 分享链接已过期或被撤销
          schema:
            $ref: '#/definitions/core.ApiResponse'
      summary: 访问分享的资源
      tags:
      - Public
  /shares:
    post:
      consumes:
      - application/json
      description: 为指定的媒体资源创建一个分享。可以分享给特定用户（通过ID）或游客。
      parameters:
      - description: 分享信息
        in: body
        name: share_info
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateShareInput'
      produces:
      - application/json
      responses:
        "201":
          description: 成功创建，返回公开分享链接
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "404":
          description: 照片或目标用户未找到
          schema:
            $ref: '#/definitions/core.ApiResponse'
      security:
      - BearerAuth: []
      summary: 创建分享链接
      tags:
      - Shares
  /shares/{share_token}/meta:
    get:
      description: 通过分享令牌获取媒体资源的元数据和临时的下载URL。这是为移动端等API客户端设计的。
      parameters:
      - description: 分享令牌
        in: path
        name: share_token
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功，返回照片元数据，并在其中动态添加一个临时的signed_url字段
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.ShareMetaResponse'
              type: object
        "404":
          description: 分享链接不存在
          schema:
            $ref: '#/definitions/core.ApiResponse'
        "410":
          description: 分享链接已过期或被撤销
          schema:
            $ref: '#/definitions/core.ApiResponse'
      summary: 获取分享元数据 (API客户端使用)
      tags:
      - Shares
  /shares/with-me:
    get:
      description: 列出其他用户分享给当前登录用户的所有有效媒体
      produces:
      - application/json
      responses:
        "200":
          description: 成功获取列表
          schema:
            allOf:
            - $ref: '#/definitions/core.ApiResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/models.Share'
                  type: array
              type: object
      security:
      - BearerAuth: []
      summary: 查看分享给我的内容
      tags:
      - Shares
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and a JWT.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
tags:
- description: 用户注册与登录
  name: Authentication
- description: 媒体资源的上传、查询和管理
  name: Media
- description: 相册管理
  name: Albums
- description: 共享资源
  name: Shares
- description: 获取共享资源
  name: Public
- description: 圈子与群组管理
  name: Groups
